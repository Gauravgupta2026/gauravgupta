<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kapu Beach — ASCII</title>
<style>html,body{height:100%;margin:0;background:#0b2cff}.hero{position:relative;height:100svh;overflow:hidden;background:#0b2cff}canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}</style></head><body><main class="hero"><canvas id="c"></canvas></main><script>
// Pipeline: analytic scene (pure fn of time) -> supersampled coverage -> 2x box downsample -> per-cell ink -> density-sorted glyph atlas
const INK='#fff',BG='#0b2cff',A=1.75,SS=4,L=12,LOOP=8,K=4,CL=[{y:.3,w:.12,h:.12,v:2.2,o:.2},{y:.55,w:.16,h:.12,v:1.4,o:.7}],SP=[1,-2,1,2,-1,2,-2,1,-1];
const JUMPS=[{t:.3,d:2.4,x0:.1,x1:.3,a:.14,s:1},{t:3,d:1.8,x0:.52,x1:.4,a:.1,s:.7},{t:5.1,d:1.4,x0:.2,x1:.28,a:.07,s:.5},{t:6.6,d:1.2,x0:.46,x1:.55,a:.06,s:.4}];
// dolphin silhouette, nose at +x, unit length, y down
const P=[[0.5,0.02],[0.47,-0.008],[0.425,-0.022],[0.385,-0.04],[0.35,-0.085],[0.3,-0.115],[0.2,-0.13],[0.08,-0.125],[-0.0,-0.11],[-0.07,-0.16],[-0.13,-0.2],[-0.2,-0.228],[-0.2,-0.228],[-0.14,-0.15],[-0.15,-0.1],[-0.25,-0.082],[-0.33,-0.05],[-0.41,-0.03],[-0.45,-0.042],[-0.5,-0.09],[-0.57,-0.125],[-0.57,-0.125],[-0.54,-0.05],[-0.525,-0.004],[-0.525,0.004],[-0.54,0.05],[-0.57,0.125],[-0.57,0.125],[-0.5,0.09],[-0.45,0.042],[-0.41,0.03],[-0.33,0.05],[-0.2,0.088],[-0.08,0.106],[-0.02,0.11],[0.03,0.245],[0.03,0.245],[0.11,0.17],[0.17,0.095],[0.27,0.076],[0.37,0.045],[0.44,0.042],[0.47,0.036]];
const mdp=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2],qb=(a,c,b,t)=>[(1-t)*(1-t)*a[0]+2*(1-t)*t*c[0]+t*t*b[0],(1-t)*(1-t)*a[1]+2*(1-t)*t*c[1]+t*t*b[1]];
const DENSE=[],BD=[];
for(let i=0,n=P.length;i<n;i++){const a=mdp(P[(i+n-1)%n],P[i]),b=mdp(P[i],P[(i+1)%n]);for(let k=0;k<6;k++)DENSE.push(qb(a,P[i],b,k/6))}
for(let k=0;k<=12;k++)BD.push(qb([.46,.018],[.02,.05],[-.4,.02],k/12));
for(let k=1;k<12;k++)BD.push(qb([-.4,.02],[0,.45],[.46,.018],k/12));
const LIGHTHOUSE_WIDTH_SCALE=1.3,LIGHTHOUSE_HEIGHT_SCALE=1.56,LIGHTHOUSE_TOP_CLEARANCE=6;
const ASCII_FALLOFF_START=.68,ASCII_FALLOFF_END=.98;
const MOBILE_SCENE_MAX_WIDTH=768,MOBILE_ISLAND_CENTER=.64,MOBILE_ISLAND_LEFT_SLOPE=.22,MOBILE_ISLAND_RIGHT_SLOPE=.38;
const MOBILE_LIGHTHOUSE_HEIGHT=.7,MOBILE_LIGHTHOUSE_HALF_WIDTH=.03;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const H=(a,b)=>{const s=Math.sin(a*127.1+b*311.7)*43758.5453;return s-Math.floor(s)};
const lerp=(a,b,t)=>a+(b-a)*t,sm=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
const vn=(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);return lerp(lerp(H(xi,yi),H(xi+1,yi),u),lerp(H(xi,yi+1),H(xi+1,yi+1),u),v)};
const wave=(c,T)=>.4*Math.sin(c*.09+T*2)+.2*Math.sin(c*.23-T*3);
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
let mobileScene,U,RTc,islandData,lighthouseData,atlas2,cols,rows,cw,ch,hr,atlas,buckets,scene,sc,mid,mc2,sm1,sc1,trail,ys,st,last;
function setup(){
 mobileScene=cv.clientWidth<=MOBILE_SCENE_MAX_WIDTH;
 const dpr=devicePixelRatio||1;cw=Math.max(5,Math.round(5.5*dpr));ch=Math.round(cw*A);
 cv.width=cv.clientWidth*dpr|0;cv.height=cv.clientHeight*dpr|0;
 cols=Math.ceil(cv.width/cw);rows=Math.ceil(cv.height/ch);hr=Math.round(rows*.58);U=Math.min(cols,hr*A*6);
 const chars=' .,:;-~=+*xoO08#%@&BM'.split(''),font=`${Math.round(ch*.82)}px ui-monospace,Menlo,Consolas,monospace`;
 const m=mk(cw,ch),mc=m.getContext('2d',{willReadFrequently:true});
 mc.font=font;mc.textAlign='center';mc.textBaseline='middle';
 const dens=chars.map(g=>{mc.clearRect(0,0,cw,ch);mc.fillText(g,cw/2,ch/2);const d=mc.getImageData(0,0,cw,ch).data;let s=0;for(let i=3;i<d.length;i+=4)s+=d[i];return s});
 const mx=Math.max(...dens);atlas=mk(cw*chars.length,ch);const ac=atlas.getContext('2d');
 ac.font=font;ac.textAlign='center';ac.textBaseline='middle';ac.fillStyle=INK;
 chars.forEach((g,i)=>ac.fillText(g,i*cw+cw/2,ch/2));
 atlas2=mk(cw*chars.length,ch);const a2=atlas2.getContext('2d');a2.font=font;a2.textAlign='center';a2.textBaseline='middle';a2.fillStyle=BG;chars.forEach((g,i)=>a2.fillText(g,i*cw+cw/2,ch/2));

 buckets=Array.from({length:L},()=>[]);
 chars.forEach((g,i)=>{if(g!==' ')buckets[Math.min(L-1,Math.max(1,Math.round(dens[i]/mx*(L-1))))].push(i)});
 for(let b=1;b<L;b++)if(!buckets[b].length){let k=1;while(!buckets[b-k]?.length&&!buckets[b+k]?.length)k++;buckets[b]=buckets[b-k]?.length?buckets[b-k]:buckets[b+k]}
 scene=mk(cols*SS,rows*SS);sc=scene.getContext('2d');mid=mk(cols*2,rows*2);mc2=mid.getContext('2d');
 sm1=mk(cols,rows);sc1=sm1.getContext('2d',{willReadFrequently:true});
 trail=new Float32Array(cols*rows);ys=new Float32Array(cols);buildIsland();buildLighthouse();
}
function buildIsland(){
 const SL=2,cl=mk(cols*SL,rows*SL),g=cl.getContext('2d');g.setTransform(SL,0,0,SL/A,0,0);
 const LX=cols*(mobileScene?MOBILE_ISLAND_CENTER:.76),Am=rows-hr+2;
 g.fillStyle='rgb(0,150,0)';g.beginPath();g.moveTo(LX-cols*.45,rows*A+6);
 const RT=x=>{const d=x-LX,gs=cols*(mobileScene?(d<0?MOBILE_ISLAND_LEFT_SLOPE:MOBILE_ISLAND_RIGHT_SLOPE):(d<0?.17:.32));return(hr+2.5+Am*(1-Math.exp(-((d/gs)**2)))+(vn(x*.03,4)-.5)*2)*A};
 for(let x=LX-cols*.45;x<=cols+2;x+=1)g.lineTo(x,RT(x));
 RTc=new Float32Array(cols);for(let c=0;c<cols;c++)RTc[c]=RT(c+.5)/A;
 g.lineTo(cols+2,rows*A+6);g.fill();
 const o=mk(cols,rows),oc=o.getContext('2d',{willReadFrequently:true});oc.drawImage(cl,0,0,cols,rows);islandData=oc.getImageData(0,0,cols,rows).data}
function lighthouseGeometry(){
 const x=cols*(mobileScene?MOBILE_ISLAND_CENTER:.76),base=RTc[Math.floor(x)]*A;
 const requestedHeight=mobileScene?hr*A*MOBILE_LIGHTHOUSE_HEIGHT:hr*A*.92*LIGHTHOUSE_WIDTH_SCALE*LIGHTHOUSE_HEIGHT_SCALE;
 const height=Math.min(requestedHeight,base-LIGHTHOUSE_TOP_CLEARANCE);
 const bottomWidth=mobileScene?cols*MOBILE_LIGHTHOUSE_HALF_WIDTH:hr*A*.92*LIGHTHOUSE_WIDTH_SCALE*.085;
 return{x,base,height,tower:height*.8,bottomWidth,topWidth:bottomWidth*(.058/.085)}
}
function buildLighthouse(){
 const SL=2,cl=mk(cols*SL,rows*SL),g=cl.getContext('2d');g.setTransform(SL,0,0,SL/A,0,0);
 const {x,base,height,tower,bottomWidth,topWidth}=lighthouseGeometry();
 const band=(from,to,color)=>{
  const y0=base-tower*from,y1=base-tower*to,w0=lerp(bottomWidth,topWidth,from),w1=lerp(bottomWidth,topWidth,to);
  g.fillStyle=color;g.beginPath();g.moveTo(x-w0,y0);g.lineTo(x+w0,y0);g.lineTo(x+w1,y1);g.lineTo(x-w1,y1);g.fill()
 };
 band(0,.15,'rgb(0,255,0)');band(.15,.35,'rgb(255,0,0)');band(.35,.55,'rgb(0,255,0)');band(.55,.77,'rgb(255,0,0)');band(.77,1,'rgb(0,255,0)');
 g.clearRect(x-.6,base-tower*.27-1.2,1.2,2.4);g.clearRect(x-.6,base-tower*.66-1.2,1.2,2.4);
 const top=base-tower,balcony=height*.015,lantern=height*.08;
 g.fillStyle='rgb(255,0,0)';g.fillRect(x-topWidth-2.5,top-balcony,2*topWidth+5,balcony);
 g.fillStyle='rgb(0,255,0)';g.fillRect(x-topWidth*.7,top-balcony-lantern,topWidth*1.4,lantern);
 g.fillStyle='rgb(0,0,255)';g.beginPath();g.ellipse(x,top-balcony-lantern,topWidth*.9,height*.055,0,Math.PI,2*Math.PI);g.fill();
 g.fillRect(x-.4,top-balcony-lantern-height*.105,.8,height*.05);
 const o=mk(cols,rows),oc=o.getContext('2d',{willReadFrequently:true});oc.drawImage(cl,0,0,cols,rows);lighthouseData=oc.getImageData(0,0,cols,rows).data
}
function drawScene(t,T){
 const s=sc;s.setTransform(1,0,0,1,0,0);s.globalCompositeOperation='source-over';s.fillStyle='#000';s.fillRect(0,0,scene.width,scene.height);
 s.setTransform(SS,0,0,SS/A,0,0);s.fillStyle='#fff';const hy=hr*A,q=cols/330;
 for(const j of JUMPS){
  const S=j.s,Lc=U*.112*S,ap=Math.min(U*j.a*.65,hy-Lc*.26-2),x0=j.x0*cols,dx=(j.x1-j.x0)*cols,dir=Math.sign(dx),u=(t-j.t)/j.d;
  const pos=v=>[x0+dx*v,hy-4*ap*v*(1-v)],tg=v=>{const a=dx,b=-4*ap*(1-2*v),m=Math.hypot(a,b);return[a/m,b/m]};
  for(const [tt,xx,kd] of [[j.t,j.x0,0],[j.t+j.d,j.x1,1]]){
   const age=(((t-tt)%LOOP)+LOOP)%LOOP,X=xx*cols,sd=tt+kd*.37;if(age>=1.1)continue;
   const f=age/1.1,g=85*q*S;
   for(let i=0;i<30;i++){const jet=i<8,h1=H(i,sd),h2=H(i+40,sd),ang=jet?1.57+(h1-.5)*.5:.35+h1*2.45,sp=(jet?28+h2*22:16+h2*30)*q*S,
    x=X+Math.cos(ang)*sp*age,y=hy-Math.sin(ang)*sp*age+.5*g*age*age;if(y>hy+1)continue;
    s.beginPath();s.arc(x,y,(jet?1.3:.8+h2*.5)*(1-f*.6)*Math.sqrt(S)+.2,0,7);s.fill()}
   if(age<.55){const k=age/.55,w=(4+26*k)*S*q,hh=(1-k)*1.6;s.fillRect(X-w,hy-2.2-hh,2*w,hh+.8)}}
  for(let i=0;i<10;i++){const ui=i*.045,age=t-(j.t+ui*j.d);if(age>0&&age<.7){
   const p=pos(ui-.5*Lc/Math.hypot(dx,4*ap*(1-2*ui))),x=p[0]+(H(i,j.t)-.5)*8*age,y=p[1]+(4+H(i,3)*6)*age+.5*70*q*S*age*age;
   if(y<hy){s.beginPath();s.arc(x,y,.9*(1-age/.7)*Math.sqrt(S)+.25,0,7);s.fill()}}}
  if(u>-.15&&u<1.15){
   const Lu=Math.hypot(dx,4*ap*(1-2*u))||1;
   const def=(px,py)=>{const up=u+px*Lc/Lu,p=pos(up),tn=tg(up),n=[-tn[1]*dir,tn[0]*dir],
    ph=6.283*2.4*u+5*px,qq=Math.pow((.5-px)/1.07,1.8);
    let lat=.06*qq*Math.sin(ph);if(px<-.45)lat+=.07*Math.sin(ph-.9)*Math.min(1,(-.45-px)/.1);
    let ax=0;if(py<-.12)ax=-(-py-.12)*.5;else if(py>.12)ax=-(py-.12)*.4;
    if(py<-.12)lat+=.02*Math.sin(ph-1.4);
    const yy=py+lat;return[p[0]+(n[0]*yy+tn[0]*ax)*Lc,p[1]+(n[1]*yy+tn[1]*ax)*Lc]};
   const pth=arr=>{s.beginPath();arr.forEach((c,i)=>{const w=def(c[0],c[1]);i?s.lineTo(w[0],w[1]):s.moveTo(w[0],w[1])});s.closePath()};
   pth(DENSE);s.fill();s.save();s.clip();s.fillStyle='#8c8c8c';pth(BD);s.fill();s.restore();
   const e=def(.335,-.045);s.fillStyle='#2a2a2a';s.beginPath();s.arc(e[0],e[1],.012*Lc,0,7);s.fill();s.fillStyle='#fff'}
 }
 // hide everything below the live wave surface
 s.globalCompositeOperation='destination-out';s.beginPath();s.moveTo(0,rows*A+9);
 for(let c=0;c<=cols+2;c+=2)s.lineTo(c,(hr+wave(c,T))*A);
 s.lineTo(cols+2,rows*A+9);s.fill();
 mc2.drawImage(scene,0,0,mid.width,mid.height);sc1.drawImage(mid,0,0,cols,rows);
 return sc1.getImageData(0,0,cols,rows).data;
}
function frame(now){
 if(!st)st=now;const ct=(now-st)/1000,t=ct%LOOP,dt=Math.min(.05,(now-(last||now))/1000);last=now;
 const bg=BG;
 const T=t*2*Math.PI/LOOP,px=drawScene(t,T),k=Math.exp(-dt*7);
 ctx.globalAlpha=1;ctx.fillStyle=bg;ctx.fillRect(0,0,cv.width,cv.height);
 for(let c=0;c<cols;c++)ys[c]=hr+wave(c,T);
 for(let r=0;r<rows;r++){
  const falloff=1-sm(ASCII_FALLOFF_START,ASCII_FALLOFF_END,(r+.5)/rows);
  for(let c=0;c<cols;c++){
  if(H(c*1.3,r*2.1)>falloff)continue;
  const i=r*cols+c;trail[i]=Math.max(px[i*4]/255,trail[i]*k);
  let ink=0;const cover=r+1-ys[c];
  if(cover>0){let g=0;
   for(let q=0;q<K;q++){
    const ry=hr+(rows-hr)*Math.pow((q+.6)/K,1.4)+(.25+.5*q/K)*Math.sin(c*(.05+.017*(q%3))+T*SP[q]+q*1.9),e=(r-ry)/(.3+.5*q/K);
    g=Math.max(g,Math.exp(-e*e)*sm(-.3,.3,Math.sin(c*.29+q*2.3+T*SP[q]*.5)))}
   ink=(.05+.7*g+(H(c,r)-.5)*.06+(cover<1.6?.45*(1.6-cover)/1.6:0))*Math.min(1,cover)
  }else if(r<hr-1){
   const fade=sm(hr*.05,hr*.3,r)*(1-sm(hr*.85,hr-1,r));
   const n=.55*vn(c*.035-ct*.35,r*.16)+.3*vn(c*.08-ct*.5,r*.35+7)+.15*vn(c*.2-ct*.6,r*.7+3),k2=sm(.5,.74,n+.15*sm(.3,.7,r/hr));
   ink=k2*(.04+.14*k2);
      for(const cl of CL){const w=cl.w*cols,span=cols*1.5,bx=((cl.o*cols-ct*cl.v)%span+span)%span-cols*.25,dyy=(r-cl.y*hr)/(cl.h*hr),d=((c-bx)/w)**2+(dyy>0?dyy*2.4:dyy)**2,val=1-d+(vn(c*.12,r*.28+cl.o*9)-.5)*.5;
    ink=Math.max(ink,sm(.05,.5,val)*.46*(val<.35?(H(c,r)<val*2.8?1:0):1))}
   ink*=fade}
  const li=i*4,red=lighthouseData[li],green=lighthouseData[li+1],blue=lighthouseData[li+2];
  // The island surface occludes every part of the tower below its footing.
  if(trail[i]<.04&&r+.5<=RTc[c]&&lighthouseData[li+3]>40){
   const X=c*cw,Y=r*ch;
   if(red>green||blue>green){
    ctx.globalAlpha=(Math.max(red,blue*.7)/255)*.85;ctx.fillStyle=INK;ctx.fillRect(X,Y,cw,ch);
    const b=buckets[L-3];ctx.drawImage(atlas2,b[(H(c*3.1,r*1.7)*b.length)|0]*cw,0,cw,ch,X,Y,cw,ch)
   }else{
    ctx.globalAlpha=.1;ctx.fillStyle=INK;ctx.fillRect(X,Y,cw,ch);ctx.globalAlpha=.8;
    const b=buckets[L-2];ctx.drawImage(atlas,b[(H(c,r)*b.length)|0]*cw,0,cw,ch,X,Y,cw,ch)
   }
   continue
  }
  if(trail[i]<.04&&islandData[i*4+1]>40){
   const X=c*cw,Y=r*ch,dep=r-RTc[c],ed=dep<1.2;
   ctx.globalAlpha=ed?.85:Math.max(.2,.5-.035*dep)*(.85+.15*H(c*2,r));
   const b=buckets[ed?L-2:Math.min(L-3,4+((H(c*2.1,r*1.3)*3)|0))];
   ctx.drawImage(atlas,b[(H(c*3.1,r)*b.length)|0]*cw,0,cw,ch,X,Y,cw,ch);
   continue}
  const dol=sm(.06,.75,trail[i]),lv=Math.min(L-1,Math.round(Math.max(ink,dol)*(L-1)));
  if(dol>.04){const b=buckets[Math.max(lv,L-4)];ctx.globalAlpha=Math.min(1,dol*1.1);ctx.fillStyle='#fff';ctx.fillRect(c*cw,r*ch,cw,ch);ctx.drawImage(atlas2,b[(H(c*3.1,r*1.7)*b.length)|0]*cw,0,cw,ch,c*cw,r*ch,cw,ch)}
  else if(lv>0){const b=buckets[lv];ctx.globalAlpha=.25+.6*ink;ctx.drawImage(atlas,b[(H(c*3.1,r*1.7)*b.length)|0]*cw,0,cw,ch,c*cw,r*ch,cw,ch)}
 }}
 ctx.globalAlpha=1;
 requestAnimationFrame(frame)
}
// The host controls playback; the initial frame is also the reduced-motion still.
const nativeRequestAnimationFrame=window.requestAnimationFrame.bind(window);
let hostPaused=true,pendingFrame=null;
window.requestAnimationFrame=callback=>{
 if(hostPaused){pendingFrame=callback;return 0}
 return nativeRequestAnimationFrame(callback)
};
addEventListener('message',event=>{
 if(event.source!==parent||event.origin!==location.origin||event.data?.source!=='kapu-beach')return;
 if(event.data.action==='pause'){hostPaused=true;return}
 if(event.data.action==='resume'){
  if(!hostPaused)return;
  hostPaused=false;
  const callback=pendingFrame;pendingFrame=null;
  nativeRequestAnimationFrame(callback||frame)
 }
});
addEventListener('resize',()=>{setup();if(hostPaused)frame(last||0)});
setup();frame(0);
</script></body></html>
