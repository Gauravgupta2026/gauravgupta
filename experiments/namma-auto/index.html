<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="A hand-painted Bengaluru auto-rickshaw. Tap it." />
    <title>Namma Auto · For Hire</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230003fd'/%3E%3Cpath d='M10 40V28q0-10 12-10h22q8 0 10 8l2 14z' fill='%23f7b500'/%3E%3Cpath d='M10 40h46v8H10z' fill='%230f7b4d'/%3E%3Ccircle cx='20' cy='50' r='6' fill='%231b1410'/%3E%3Ccircle cx='48' cy='50' r='6' fill='%231b1410'/%3E%3C/svg%3E"
    />
  </head>
  <body data-state="loading">
    <div id="art" role="group" aria-label="A hand-painted Bengaluru auto-rickshaw on a flower-lined road. Tap the auto.">
      <main id="stage">
        <div id="world">
          <img id="scene" alt="" draggable="false" />
          <canvas id="ground" aria-hidden="true"></canvas>
          <canvas id="fxBack" aria-hidden="true"></canvas>
          <div id="rig">
            <div id="shadow"></div>
            <button id="autoBtn" type="button" aria-label="Tap the auto"></button>
          </div>
          <canvas id="fxFront" aria-hidden="true"></canvas>
        </div>
      </main>
    </div>

    <div id="grain" aria-hidden="true"></div>

    <div id="glint" aria-hidden="true"></div>

    <button id="soundBtn" type="button" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path class="spk" d="M4 9v6h4l5 4V5L8 9z" />
        <path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" />
        <path class="mute" d="M16 9l5 6M21 9l-5 6" />
      </svg>
    </button>

    <button id="hirePrompt" type="button">Hiring, yes?</button>

    <div id="loader" role="status" aria-label="Loading artwork"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
